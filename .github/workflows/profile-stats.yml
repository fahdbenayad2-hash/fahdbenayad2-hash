name: Refresh GitHub profile graphics

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/render_stats.py'
      - '.github/workflows/profile-stats.yml'
      - 'assets/avatar.jpg'

permissions:
  contents: write

concurrency:
  group: github-profile-metrics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image conversion dependency
        run: python -m pip install 'Pillow>=10,<12'
      - name: Create accurate activity graphics
        env:
          GH_STATS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PROFILE_LOGIN: fahdbenayad2-hash
        run: python scripts/render_stats.py
      - name: Commit changed SVG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg assets/terminal.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update live GitHub metrics"
            git push
          else
            echo "Graphics already up to date."
          fi
